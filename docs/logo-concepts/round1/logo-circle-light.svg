<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;display=swap');</style>
<circle cx="200" cy="200" r="200" fill="#FBF6E9"/>
<!-- frame: solid ring + jewelled dotted ring -->
<circle cx="200" cy="200" r="190" fill="none" stroke="#C4942F" stroke-width="2"/>
<circle cx="200" cy="200" r="180" fill="none" stroke="#C4942F" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
<!-- cone emblem, top -->

<g transform="translate(178 28) scale(1.0)">
  <!-- cone: drawn tip-at-origin pointing right, then rotated to point lower-left -->
  <g transform="translate(30 70) rotate(-38)">
    <path d="M 0 0 L 74 -12 L 74 12 Z" fill="#6B3A1E"/>
    <path d="M 0 0 L 74 -12 L 74 -4 Z" fill="#8A4B22" opacity="0.55"/>
    <path d="M 0 0 L 10 -1.6 L 10 1.6 Z" fill="#C4942F"/>
    <path d="M 44 -7 L 44 7" stroke="#C4942F" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 52 -8.2 L 52 8.2" stroke="#E1B458" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    <!-- crimped end -->
    <rect x="72" y="-15" width="10" height="30" rx="2.5" fill="#8A4B22" stroke="#C4942F" stroke-width="1.2"/>
    <path d="M 75.5 -11 L 75.5 11 M 78.5 -11 L 78.5 11" stroke="#C4942F" stroke-width="0.9" opacity="0.8"/>
  </g>
  <!-- mehndi trail from the tip -->
  <path d="M 30 70 C 22 76, 10 74, 6 82 C 2 90, 10 96, 18 92 C 26 88, 22 80, 14 82" fill="none" stroke="#6B3A1E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 6 82 C -2 86, -12 84, -16 92" fill="none" stroke="#6B3A1E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- paisley at the end of the trail -->
  <path d="M -16 92 C -26 90, -34 100, -28 108 C -22 114, -12 110, -12 102 C -12 98, -14 95, -16 92 Z" fill="none" stroke="#6B3A1E" stroke-width="1.4"/>
  <path d="M -19 97 C -25 97, -28 103, -24 106 C -20 108, -17 104, -18 100 Z" fill="none" stroke="#6B3A1E" stroke-width="1"/>
  <!-- leaves along the trail -->
  <path d="M 20 74 q 4 -7 11 -5 q -3 7 -11 5 z" fill="#6B3A1E"/>
  <path d="M 10 77 q -7 -3 -9 -10 q 7 2 9 10 z" fill="#6B3A1E"/>
  <path d="M 14 94 q 1 7 -5 11 q -2 -7 5 -11 z" fill="#6B3A1E"/>
  <path d="M -6 84 q -3 -7 3 -11 q 3 6 -3 11 z" fill="#6B3A1E"/>
  <!-- dots -->
  <circle cx="24" cy="84" r="1.5" fill="#C4942F"/>
  <circle cx="2" cy="94" r="1.4" fill="#C4942F"/>
  <circle cx="-8" cy="100" r="1.2" fill="#C4942F"/>
  <circle cx="-30" cy="97" r="1.3" fill="#C0125C"/>
  <circle cx="-22" cy="112" r="1.1" fill="#C4942F"/>
</g>
<!-- wordmark, centre -->

<text x="200" y="214" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="600" font-size="38" fill="#3C0C54" letter-spacing="1">Riddhi Siddhi</text>
<text x="200" y="244" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="500" font-size="13" fill="#C4942F" letter-spacing="7">CREATIONS</text>

<line x1="156" y1="262" x2="188" y2="262" stroke="#C4942F" stroke-width="1"/>
