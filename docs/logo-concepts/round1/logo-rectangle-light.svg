  <path d="M 44 40 q 6 -1 8 5 q -6 1 -8 -5 z" fill="#6B3A1E"/>
  <circle cx="21" cy="22" r="1.6" fill="#C4942F"/>
  <circle cx="49" cy="56" r="1.3" fill="#C4942F"/>
  <circle cx="3" cy="38" r="1.2" fill="#C0125C"/>
</g>
